spring.application.name=CampHubAPI

# Accept connections from this machine only
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/camphub_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=${DB_USERNAME:camphub_user}
spring.datasource.password=${DB_PASSWORD:camphub_dev_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta

# Min 32 characters
app.jwt.secret=${JWT_SECRET:ganti-dengan-string-acak-minimal-32-karakter}
app.jwt.expiration-ms=86400000

# Seeded admin (development only)
app.seed.admin-password=${ADMIN_PASSWORD:admin_dev_password}
